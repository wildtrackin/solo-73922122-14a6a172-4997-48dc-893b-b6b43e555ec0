# 本地编排：源库(PG16+wal2json) + 独立日志库(PG16) + API + 采集器
name: lab-cdc

services:
  source-db:
    build:
      context: ./source-db
    image: lab-cdc/source-pg16-wal2json:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=8"
      - "-c"
      - "max_replication_slots=8"
    ports:
      - "${SOURCE_DB_PORT}:5432"
    volumes:
      - source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [labnet]

  log-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LOG_DB_NAME}
      POSTGRES_USER: ${LOG_DB_USER}
      POSTGRES_PASSWORD: ${LOG_DB_PASSWORD}
    ports:
      - "${LOG_DB_PORT}:5432"
    volumes:
      - log_pgdata:/var/lib/postgresql/data
      - ./log-db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOG_DB_USER} -d ${LOG_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [labnet]

  api:
    build:
      context: ./app
    image: lab-cdc/app:local
    command: ["api"]
    environment:
      SOURCE_DB_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@source-db:5432/${POSTGRES_DB}"
      SOURCE_REPL_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@source-db:5432/${POSTGRES_DB}?replication=database"
      LOG_DB_DSN: "postgresql://${LOG_DB_USER}:${LOG_DB_PASSWORD}@log-db:5432/${LOG_DB_NAME}"
      SLOT_NAME: "${SLOT_NAME}"
    ports:
      - "${API_PORT}:8000"
    depends_on:
      source-db:
        condition: service_healthy
      log-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [labnet]

  collector:
    image: lab-cdc/app:local
    command: ["collector"]
    # 故意不设 restart: 崩溃演示需要进程保持退出，由操作者手动启动续采
    restart: "no"
    environment:
      SOURCE_DB_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@source-db:5432/${POSTGRES_DB}"
      SOURCE_REPL_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@source-db:5432/${POSTGRES_DB}?replication=database"
      LOG_DB_DSN: "postgresql://${LOG_DB_USER}:${LOG_DB_PASSWORD}@log-db:5432/${LOG_DB_NAME}"
      SLOT_NAME: "${SLOT_NAME}"
      CRASH_AFTER_PERSIST: "${CRASH_AFTER_PERSIST:-0}"
      CRASH_MARKER_PATH: "/var/lib/lab-cdc/crash-once"
    volumes:
      - crash_marker:/var/lib/lab-cdc
    depends_on:
      source-db:
        condition: service_healthy
      log-db:
        condition: service_healthy
    networks: [labnet]

volumes:
  source_pgdata:
  log_pgdata:
  crash_marker:

networks:
  labnet:
    driver: bridge
